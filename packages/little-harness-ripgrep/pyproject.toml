[project]
name = "little-harness-ripgrep"
version = "0.1.0"
description = "Ripgrep (rg) content-search tool plugin for little-harness."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "Gabriel Menezes", email = "gabriel.d.menezes@gmail.com" }]
# The `rg` binary is a runtime system dependency, not a Python package.
dependencies = [
    "little-harness-core",
]

[project.urls]
Homepage = "https://github.com/dmenezesgabriel/little-harness"
Repository = "https://github.com/dmenezesgabriel/little-harness"
Issues = "https://github.com/dmenezesgabriel/little-harness/issues"

[project.entry-points."little_harness.tools"]
ripgrep = "little_harness_ripgrep.provider:build"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/little_harness_ripgrep"]

[tool.pyright]
include = ["src/little_harness_ripgrep", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
venvPath = "../.."
venv = ".venv"

[tool.uv.sources]
little-harness-core = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "--strict-config --strict-markers --tb=short -q -ra --cov=little_harness_ripgrep --cov-report=term-missing -m 'not integration'"
markers = [
    "integration: end-to-end tests that run a tool through the core (opt-in)",
]

[tool.mutmut]
paths_to_mutate = ["src/little_harness_ripgrep"]
tests_dir = ["tests"]
pytest_add_cli_args = ["--no-cov"]

[tool.deptry]
extend_exclude = ["tests"]
package_module_name_map = { little-harness-core = ["little_harness"] }
known_first_party = ["little_harness_ripgrep"]

[tool.vulture]
paths = ["src/little_harness_ripgrep", "tests"]
min_confidence = 80


[tool.importlinter]
root_packages = ["little_harness_ripgrep", "little_harness"]

[[tool.importlinter.contracts]]
name = "Plugin touches only core domain and ports"
type = "forbidden"
source_modules = ["little_harness_ripgrep"]
forbidden_modules = [
    "little_harness.infrastructure",
    "little_harness.presentation",
]
