[project]
name = "little-harness"
version = "0.1.0"
description = "Umbrella for little-harness: the core CLI, with providers and tools selected as extras."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "Gabriel Menezes", email = "gabriel.d.menezes@gmail.com" }]
# Bare install is core-only; every provider/tool is opt-in via an extra below.
dependencies = [
    "little-harness-core",
]

[project.urls]
Homepage = "https://github.com/dmenezesgabriel/little-harness"
Repository = "https://github.com/dmenezesgabriel/little-harness"
Issues = "https://github.com/dmenezesgabriel/little-harness/issues"

[project.optional-dependencies]
llama-cpp = ["little-harness-llama-cpp"]
litellm = ["little-harness-litellm"]
calculator = ["little-harness-calculator"]
file-tools = ["little-harness-file-tools"]
ripgrep = ["little-harness-ripgrep"]
ast = ["little-harness-ast"]
json-policy = ["little-harness-json-policy"]
logging = ["little-harness-logging"]
rich = ["little-harness-rich"]
session-jsonl = ["little-harness-session-jsonl"]
all = [
    "little-harness[llama-cpp,litellm,calculator,file-tools,ripgrep,ast,json-policy,logging,rich,session-jsonl]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Meta-distribution: it ships no importable code, only a curated dependency set.
bypass-selection = true

[tool.uv.sources]
little-harness-core = { workspace = true }
little-harness-llama-cpp = { workspace = true }
little-harness-calculator = { workspace = true }
little-harness-litellm = { workspace = true }
little-harness-file-tools = { workspace = true }
little-harness-ripgrep = { workspace = true }
little-harness-ast = { workspace = true }
little-harness-json-policy = { workspace = true }
little-harness-logging = { workspace = true }
little-harness-rich = { workspace = true }
little-harness-session-jsonl = { workspace = true }

# The umbrella ships no importable code, so it has no coverage/mutation/typecheck
# gate. Its only tests are the opt-in end-to-end suite that drives every plugin
# through a real provider; both marker groups are deselected by default so a plain
# `pytest` here collects nothing slow or network-bound.
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "--strict-config --strict-markers --tb=short -q -ra -p no:cacheprovider -m 'not local_model and not network'"
markers = [
    "integration: end-to-end tests that run a real provider through the core (opt-in)",
    "local_model: drives a real local llama.cpp GGUF; skipped when the model file is absent",
    "network: calls a remote provider (Gemini via litellm); skipped without GEMINI_API_KEY",
]
