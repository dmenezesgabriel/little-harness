[project]
name = "little-harness"
version = "0.1.0"
description = "Batteries-included little-harness: core CLI + llama.cpp provider + calculator tool."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "little-harness-core",
    "little-harness-llama-cpp",
    "little-harness-calculator",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Meta-distribution: it ships no importable code, only a curated dependency set.
bypass-selection = true

[tool.uv.sources]
little-harness-core = { workspace = true }
little-harness-llama-cpp = { workspace = true }
little-harness-calculator = { workspace = true }
