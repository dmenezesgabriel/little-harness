[project]
name = "little-harness-calculator"
version = "0.1.0"
description = "Safe arithmetic calculator tool plugin for little-harness."
requires-python = ">=3.12,<3.13"
dependencies = [
    "little-harness-core",
]

[project.entry-points."little_harness.tools"]
calculator = "little_harness_calculator.provider:build"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/little_harness_calculator"]

[tool.pyright]
include = ["src/little_harness_calculator", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
venvPath = "../.."
venv = ".venv"

[tool.uv.sources]
little-harness-core = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "--strict-config --strict-markers --tb=short -q -ra --cov=little_harness_calculator --cov-report=term-missing"

[tool.mutmut]
paths_to_mutate = ["src/little_harness_calculator"]
tests_dir = ["tests"]
pytest_add_cli_args = ["--no-cov"]

[tool.deptry]
extend_exclude = ["tests"]
# Editable workspace install: tell deptry the core distribution provides `little_harness`.
package_module_name_map = { little-harness-core = ["little_harness"] }
# src/ layout: our own package is first-party (it now lives under src/).
known_first_party = ["little_harness_calculator"]

[tool.vulture]
paths = ["src/little_harness_calculator", "tests"]
min_confidence = 80

[tool.importlinter]
root_packages = ["little_harness_calculator", "little_harness"]

[[tool.importlinter.contracts]]
name = "Plugin touches only core domain and ports"
type = "forbidden"
source_modules = ["little_harness_calculator"]
forbidden_modules = [
    "little_harness.infrastructure",
    "little_harness.presentation",
]
