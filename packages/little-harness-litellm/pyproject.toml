[project]
name = "little-harness-litellm"
version = "0.1.0"
description = "LiteLLM (multi-provider) chat-model plugin for little-harness."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "Gabriel Menezes", email = "gabriel.d.menezes@gmail.com" }]
dependencies = [
    "little-harness-core",
    "litellm==1.86.2",
]

[project.urls]
Homepage = "https://github.com/dmenezesgabriel/little-harness"
Repository = "https://github.com/dmenezesgabriel/little-harness"
Issues = "https://github.com/dmenezesgabriel/little-harness/issues"

[project.entry-points."little_harness.chat_model_providers"]
litellm = "little_harness_litellm.provider:build"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/little_harness_litellm"]

[tool.pyright]
include = ["src/little_harness_litellm", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
venvPath = "../.."
venv = ".venv"

[tool.uv.sources]
little-harness-core = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
addopts = "--strict-config --strict-markers --tb=short -q -ra --cov=little_harness_litellm --cov-report=term-missing"

[tool.mutmut]
paths_to_mutate = ["src/little_harness_litellm"]
tests_dir = ["tests"]
pytest_add_cli_args = ["--no-cov"]

[tool.deptry]
extend_exclude = ["tests"]
# Editable workspace install: tell deptry the core distribution provides `little_harness`.
package_module_name_map = { little-harness-core = ["little_harness"] }
# src/ layout: our own package is first-party (it now lives under src/).
known_first_party = ["little_harness_litellm"]

[tool.vulture]
paths = ["src/little_harness_litellm", "tests"]
min_confidence = 80

[tool.importlinter]
root_packages = ["little_harness_litellm", "little_harness"]

[[tool.importlinter.contracts]]
name = "Plugin touches only core domain and ports"
type = "forbidden"
source_modules = ["little_harness_litellm"]
forbidden_modules = [
    "little_harness.infrastructure",
    "little_harness.presentation",
]

[dependency-groups]
dev = [
    "bandit==1.9.4",
    "deptry==0.25.1",
    "import-linter==2.12",
    "mutmut==3.5.0",
    "pyright==1.1.409",
    "pytest==9.0.3",
    "pytest-bdd==8.1.0",
    "pytest-cov==7.1.0",
    "pytest-timeout==2.3.1",
    "radon==6.0.1",
    "ruff==0.15.14",
    "semgrep==1.166.0",
    "vulture==2.16",
]
