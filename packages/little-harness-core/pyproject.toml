[project]
name = "little-harness-core"
version = "0.1.0"
description = "Core agent loop, ports, discovery, and CLI for the little-harness LLM harness."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "Gabriel Menezes", email = "gabriel.d.menezes@gmail.com" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/dmenezesgabriel/little-harness"
Repository = "https://github.com/dmenezesgabriel/little-harness"
Issues = "https://github.com/dmenezesgabriel/little-harness/issues"

[project.scripts]
little-harness = "little_harness.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/little_harness"]

[tool.pyright]
include = ["src/little_harness", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
# Tests legitimately inspect internal state; source code has 0 private usage.
reportPrivateUsage = false
venvPath = "../.."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
addopts = "--strict-config --strict-markers --tb=short -q -ra --cov=little_harness --cov-report=term-missing"

[tool.coverage.report]
# Standard exclusion: the `python -m little_harness` guard is not executed in tests.
exclude_also = ["if __name__ == .__main__.:"]

[tool.mutmut]
paths_to_mutate = ["src/little_harness"]
tests_dir = ["tests"]
pytest_add_cli_args = ["--no-cov"]

[tool.deptry]
extend_exclude = ["tests"]
# src/ layout: tell deptry our own package is first-party (it scans the project
# root for first-party modules, which now live under src/ rather than beside it).
known_first_party = ["little_harness"]

[tool.vulture]
paths = ["src/little_harness", "tests"]
min_confidence = 80
ignore_names = ["fake_provider_and_policy"]

[tool.importlinter]
root_package = "little_harness"

[[tool.importlinter.contracts]]
name = "Domain is the innermost layer"
type = "layers"
layers = ["application", "domain"]
containers = ["little_harness"]

[[tool.importlinter.contracts]]
name = "Core stays free of outer layers"
type = "forbidden"
source_modules = ["little_harness.domain", "little_harness.application"]
forbidden_modules = ["little_harness.infrastructure", "little_harness.presentation"]

[[tool.importlinter.contracts]]
name = "Infrastructure and presentation are independent"
type = "independence"
modules = ["little_harness.infrastructure", "little_harness.presentation"]

[dependency-groups]
dev = [
    "bandit==1.9.4",
    "deptry==0.25.1",
    "import-linter==2.11",
    "mutmut==3.5.0",
    "pyright==1.1.409",
    "pytest==9.0.3",
    "pytest-bdd==8.1.0",
    "pytest-cov==7.1.0",
    "pytest-timeout==2.3.1",
    "radon==6.0.1",
    "ruff==0.15.14",
    "semgrep==1.163.0",
    "vulture==2.16",
]
