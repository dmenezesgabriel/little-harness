[project]
name = "little-harness-core"
version = "0.1.0"
description = "Core agent loop, ports, discovery, and CLI for the little-harness LLM harness."
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
little-harness = "little_harness.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["little_harness"]

[tool.pyright]
include = ["little_harness", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
venvPath = "../.."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "--strict-config --strict-markers --tb=short -q -ra --cov=little_harness --cov-report=term-missing"

[tool.coverage.report]
# Standard exclusion: the `python -m little_harness` guard is not executed in tests.
exclude_also = ["if __name__ == .__main__.:"]

[tool.mutmut]
paths_to_mutate = ["little_harness"]
tests_dir = ["tests"]
pytest_add_cli_args = ["--no-cov"]

[tool.deptry]
extend_exclude = ["tests"]

[tool.vulture]
paths = ["little_harness", "tests"]
min_confidence = 80

[tool.importlinter]
root_package = "little_harness"

[[tool.importlinter.contracts]]
name = "Domain is the innermost layer"
type = "layers"
layers = ["application", "domain"]
containers = ["little_harness"]

[[tool.importlinter.contracts]]
name = "Core stays free of outer layers"
type = "forbidden"
source_modules = ["little_harness.domain", "little_harness.application"]
forbidden_modules = ["little_harness.infrastructure", "little_harness.presentation"]

[[tool.importlinter.contracts]]
name = "Infrastructure and presentation are independent"
type = "independence"
modules = ["little_harness.infrastructure", "little_harness.presentation"]
