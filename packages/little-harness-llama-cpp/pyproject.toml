[project]
name = "little-harness-llama-cpp"
version = "0.1.0"
description = "llama.cpp chat-model provider plugin for little-harness."
requires-python = ">=3.12,<3.13"
dependencies = [
    "little-harness-core",
    "llama-cpp-python==0.3.23",
]

[project.entry-points."little_harness.chat_model_providers"]
llama_cpp = "little_harness_llama_cpp.provider:build"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/little_harness_llama_cpp"]

[tool.pyright]
include = ["src/little_harness_llama_cpp", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
venvPath = "../.."
venv = ".venv"

[tool.uv.sources]
little-harness-core = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "--strict-config --strict-markers --tb=short -q -ra --cov=little_harness_llama_cpp --cov-report=term-missing -m 'not integration'"
markers = [
    "integration: end-to-end tests that load the real local GGUF model (slow, opt-in)",
]

[tool.mutmut]
paths_to_mutate = ["src/little_harness_llama_cpp"]
tests_dir = ["tests"]
pytest_add_cli_args = ["--no-cov"]

[tool.deptry]
extend_exclude = ["tests"]
# Editable workspace install: tell deptry the core distribution provides `little_harness`.
package_module_name_map = { little-harness-core = ["little_harness"] }
# src/ layout: our own package is first-party (it now lives under src/).
known_first_party = ["little_harness_llama_cpp"]

[tool.vulture]
paths = ["src/little_harness_llama_cpp", "tests"]
min_confidence = 80

[tool.importlinter]
root_packages = ["little_harness_llama_cpp", "little_harness"]

[[tool.importlinter.contracts]]
name = "Plugin touches only core domain and ports"
type = "forbidden"
source_modules = ["little_harness_llama_cpp"]
forbidden_modules = [
    "little_harness.infrastructure",
    "little_harness.presentation",
]
