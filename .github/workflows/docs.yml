name: docs

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync workspace
        run: uv sync --all-packages
      - name: Build docs
        run: uv run --directory packages/little-harness-docs \
                sphinx-build -b html source build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/little-harness-docs/source/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://dmenezesgabriel.github.io/little-harness/
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
