# little-harness configuration — tuned for small local models on CPU.
#
# Profiles bundle sampling + loop bounds + a tool all-list + llama.cpp load
# options. Activate one with `--profile NAME` (or set `profile = "..."` below).
# Rationale and measurements: packages/little-harness/evaluation/SMALL_LLM_TUNING_REPORT.md
#
# NOTE: a profile's [profiles.X.plugins.llama_cpp] table *replaces* the base
# [plugins.llama_cpp] table wholesale (it is not merged), so each profile below
# repeats the full llama.cpp block.

# --- Base defaults (used when no --profile is given) ---
temperature = 0.1
max_tokens = 512
max_iterations = 5

[plugins.llama_cpp]
# 4 = the machine's physical core count. llama.cpp gains nothing from the
# hyperthread siblings for token decode on this CPU; see report sweep B.
n_threads = "4"
n_batch = "256"
n_ctx = "4096"
n_gpu_layers = "0"
flash_attn = "false"

# --- fast: lowest latency. Tiny tool set keeps the system prompt + GBNF grammar
# small (the dominant TTFT cost on CPU); short loop; small context. ---
[profiles.fast]
temperature = 0.0
max_tokens = 256
max_iterations = 3
tools = ["calculator", "read_file", "ripgrep"]

[profiles.fast.plugins.llama_cpp]
n_threads = "4"
n_batch = "256"
n_ctx = "2048"
n_gpu_layers = "0"
flash_attn = "false"

# --- balanced: day-to-day default. The five tools small models use reliably
# (excludes ast_*, bash, web_fetch). ---
[profiles.balanced]
temperature = 0.1
max_tokens = 512
max_iterations = 5
tools = ["calculator", "read_file", "edit_file", "ripgrep", "ls"]

[profiles.balanced.plugins.llama_cpp]
n_threads = "4"
n_batch = "256"
n_ctx = "4096"
n_gpu_layers = "0"
flash_attn = "false"

# --- code: code tasks on the 7B coder model. Read/search/edit, larger context. ---
[profiles.code]
temperature = 0.1
max_tokens = 1024
max_iterations = 6
tools = ["read_file", "ripgrep", "edit_file", "ls", "find"]

[profiles.code.plugins.llama_cpp]
model_path = "models/qwen2.5-coder-7b-instruct-q4_k_m.gguf"
n_threads = "4"
n_batch = "256"
n_ctx = "8192"
n_gpu_layers = "0"
flash_attn = "false"

# --- tiny: the 350M/1.2B models. Single-purpose tools, deterministic sampling,
# slightly higher iteration cap to absorb JSON-repair retries. ---
[profiles.tiny]
temperature = 0.0
max_tokens = 384
max_iterations = 6
tools = ["calculator", "read_file", "ripgrep"]

[profiles.tiny.plugins.llama_cpp]
model_path = "models/LFM2.5-1.2B-Instruct-Q8_0.gguf"
n_threads = "4"
n_batch = "256"
n_ctx = "2048"
n_gpu_layers = "0"
flash_attn = "false"
