repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-check
        name: ruff check
        entry: make lint
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-docstyle
        name: ruff docstring check
        entry: uv run ruff check --select D .
        language: system
        pass_filenames: false
        always_run: true
      - id: pyright
        name: pyright (per package)
        entry: make typecheck
        language: system
        pass_filenames: false
        always_run: true
      - id: radon
        name: radon complexity
        entry: make complexity
        language: system
        pass_filenames: false
        always_run: true
      - id: vulture
        name: vulture dead code
        entry: make dead-code
        language: system
        pass_filenames: false
        always_run: true
      - id: deptry
        name: deptry dependencies
        entry: make deps
        language: system
        pass_filenames: false
        always_run: true
      - id: import-linter
        name: import-linter
        entry: make imports
        language: system
        pass_filenames: false
        always_run: true
      - id: bandit
        name: bandit security
        entry: make security
        language: system
        pass_filenames: false
        always_run: true
      - id: semgrep
        name: semgrep agents rules
        entry: make semgrep
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest
        name: pytest (per package)
        entry: make test
        language: system
        pass_filenames: false
        always_run: true
