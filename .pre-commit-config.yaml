repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check .
        language: system
        pass_filenames: false
        always_run: true
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        pass_filenames: false
        always_run: true
      - id: radon
        name: radon complexity
        entry: sh -c 'output="$(uv run radon cc local_llm main.py --min B)"; if [ -n "$output" ]; then printf "%s\n" "$output"; exit 1; fi'
        language: system
        pass_filenames: false
        always_run: true
      - id: vulture
        name: vulture dead code
        entry: uv run vulture local_llm main.py tests
        language: system
        pass_filenames: false
        always_run: true
      - id: deptry
        name: deptry dependencies
        entry: uv run deptry .
        language: system
        pass_filenames: false
        always_run: true
      - id: import-linter
        name: import-linter
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        always_run: true
      - id: bandit
        name: bandit security
        entry: uv run bandit -r local_llm main.py
        language: system
        pass_filenames: false
        always_run: true
      - id: semgrep
        name: semgrep agents rules
        entry: uv run semgrep --error --config semgrep-rules .
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true
