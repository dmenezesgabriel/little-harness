[tool.uv.workspace]
members = [
    "packages/little-harness-core",
    "packages/little-harness-llama-cpp",
    "packages/little-harness-calculator",
    "packages/little-harness-litellm",
    "packages/little-harness",
]

[dependency-groups]
dev = [
    "bandit==1.9.4",
    "deptry==0.25.1",
    "import-linter==2.11",
    "mutmut==3.5.0",
    "pre-commit==4.6.0",
    "pyright==1.1.409",
    "pytest==9.0.3",
    "pytest-bdd==8.1.0",
    "pytest-cov==7.1.0",
    "radon==6.0.1",
    "ruff==0.15.14",
    "semgrep==1.163.0",
    "vulture==2.16",
    # Workspace members, installed editable so entry points register for discovery.
    "little-harness-core",
    "little-harness-llama-cpp",
    "little-harness-calculator",
    "little-harness-litellm",
]

[tool.uv]
exclude-newer = "7 days"

[tool.uv.sources]
little-harness-core = { workspace = true }
little-harness-llama-cpp = { workspace = true }
little-harness-calculator = { workspace = true }
little-harness-litellm = { workspace = true }

# --- Shared lint/type config applied repo-wide (one source of truth) ---

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [".git", ".venv", "__pycache__", "models"]

[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "ARG",
    "B",
    "C4",
    "C90",
    "E",
    "ERA",
    "F",
    "I",
    "N",
    "PL",
    "PTH",
    "RET",
    "RUF",
    "SIM",
    "UP",
    "W",
]
ignore = [
    "ANN401",
    "PLR0913",
]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 6
max-branches = 8
max-returns = 4
max-statements = 20

# pyright is configured per package (each member's pyproject) and run with
# `uv run --directory packages/<member> pyright`, so each package's local `tests`
# package resolves without colliding with another member's `tests` package.
