[tool.uv.workspace]
members = [
    "packages/little-harness-core",
    "packages/little-harness-llama-cpp",
    "packages/little-harness-calculator",
    "packages/little-harness-litellm",
    "packages/little-harness-file-tools",
    "packages/little-harness-ripgrep",
    "packages/little-harness-ast",
    "packages/little-harness-json-policy",
    "packages/little-harness-logging",
    "packages/little-harness-rich",
    "packages/little-harness",
    "packages/little-harness-docs",
]

[dependency-groups]
dev = [
    "bandit==1.9.4",
    "deptry==0.25.1",
    "import-linter==2.11",
    "mutmut==3.5.0",
    "pre-commit==4.6.0",
    "pyright==1.1.409",
    "pytest==9.0.3",
    "pytest-bdd==8.1.0",
    "pytest-cov==7.1.0",
    "pytest-timeout==2.3.1",
    "radon==6.0.1",
    "ruff==0.15.14",
    "semgrep==1.163.0",
    "vulture==2.16",
    # Workspace members, installed editable so entry points register for discovery.
    "little-harness-core",
    "little-harness-llama-cpp",
    "little-harness-calculator",
    "little-harness-litellm",
    "little-harness-file-tools",
    "little-harness-ripgrep",
    "little-harness-ast",
    "little-harness-json-policy",
    "little-harness-logging",
    "little-harness-rich",
]

[tool.uv]
exclude-newer = "7 days"

[tool.uv.sources]
little-harness-core = { workspace = true }
little-harness-llama-cpp = { workspace = true }
little-harness-calculator = { workspace = true }
little-harness-litellm = { workspace = true }
little-harness-file-tools = { workspace = true }
little-harness-ripgrep = { workspace = true }
little-harness-ast = { workspace = true }
little-harness-json-policy = { workspace = true }
little-harness-logging = { workspace = true }
little-harness-rich = { workspace = true }
little-harness-docs = { workspace = true }

# --- Shared lint/type config applied repo-wide (one source of truth) ---

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [".git", ".venv", "__pycache__", "models"]

[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "ARG",
    "B",
    "C4",
    "C90",
    "D",
    "E",
    "ERA",
    "F",
    "I",
    "N",
    "PL",
    "PTH",
    "RET",
    "RUF",
    "SIM",
    "UP",
    "W",
]
ignore = [
    "ANN401",
    "PLR0913",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# SubprocessShellRunner reports non-zero exits via CommandOutcome instead of
# raising, so it omits `check`. An explicit `check=False` (what PLW1510 wants)
# only adds an *equivalent* mutant the zero-survivor mutation gate cannot kill,
# so the two gates conflict here; the runners are covered by their own tests.
"**/shell_command_runner.py" = ["PLW1510"]

# All source packages have documented D rules; tests and docs remain excluded.
# "packages/little-harness-litellm/src/**" = ["D"]  # documented
# "packages/little-harness-logging/src/**" = ["D"]  # documented
"**/tests/**" = [
    "D",
    # ARG (unused args): common for pytest fixture injection where the fixture
    # is pulled in by name (side-effect) and not referenced in the test body.
    "ARG",
    # PLR2004 (magic-value comparison): acceptable in test assertions
    # where constants like 2, 3, 8 are self-evident.
    "PLR2004",
]
"packages/little-harness-docs/**" = ["D"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 6
max-branches = 8
max-returns = 4
max-statements = 20

# pyright is configured per package (each member's pyproject) and run with
# `uv run --directory packages/<member> pyright`, so each package's local `tests`
# package resolves without colliding with another member's `tests` package.
