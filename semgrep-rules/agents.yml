rules:
  - id: agents-no-else
    message: AGENTS.md requires early returns over else blocks.
    severity: ERROR
    languages: [python]
    pattern: |
      if $COND:
        ...
      else:
        ...

  - id: agents-no-typing-dict
    message: AGENTS.md requires modern explicit types; use dict[...] instead of typing.Dict.
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern: from typing import Dict
      - pattern: typing.Dict[$KEY, $VALUE]

  - id: agents-llama-cpp-wrapper-boundary
    message: Keep llama_cpp imports inside the little_harness_llama_cpp adapter package.
    severity: ERROR
    languages: [python]
    paths:
      exclude:
        - little_harness_llama_cpp/
    pattern-either:
      - pattern: import llama_cpp
      - pattern: from llama_cpp import $NAME

  - id: agents-tree-sitter-wrapper-boundary
    message: Keep tree_sitter imports inside the little_harness_ast adapter package.
    severity: ERROR
    languages: [python]
    paths:
      exclude:
        - little_harness_ast/
    pattern-either:
      - pattern: import tree_sitter
      - pattern: import tree_sitter_python
      - pattern: import tree_sitter_javascript
      - pattern: from tree_sitter import $NAME

  - id: agents-exception-message-expected-shape
    message: Exception messages must include the offending value and expected shape.
    severity: ERROR
    languages: [python]
    patterns:
      - pattern: raise $ERROR($MESSAGE)
      - metavariable-regex:
          metavariable: $ERROR
          regex: ^(ValueError|TypeError|AgentProtocolError)$
      - pattern-not-regex: Expected|expected
